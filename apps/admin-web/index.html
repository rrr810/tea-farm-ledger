<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tea Farm Ledger — Admin</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#F6F8F6;color:#111}
  header{background:#1B4332;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:18px}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  nav button{padding:8px 12px;border-radius:8px;border:1px solid #2D6A4F;background:white;color:#1B4332;font-weight:600;cursor:pointer}
  nav button.active{background:#1B4332;color:white}
  .card{background:white;border:1px solid #E0E8E0;border-radius:12px;padding:16px;margin:16px}
  .badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
  .locked{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7}
  .open{background:#FFF3E0;color:#EF6C00;border:1px solid #FFCC80}
  table{width:100%;border-collapse:collapse}
  th{background:#F0F4F0;padding:8px;text-align:left;font-size:12px;color:#444}
  td{padding:8px;border-bottom:1px solid #EEE;font-size:13px}
  input,select,textarea{padding:8px 10px;border:1px solid #CCC;border-radius:8px;font-size:14px}
  button.primary{background:#1B4332;color:white;border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}
  button.secondary{background:white;color:#1B4332;border:1px solid #1B4332;padding:8px 12px;border-radius:8px;cursor:pointer}
  .flag{font-size:11px;color:#C62828;background:#FDEDEC;padding:2px 6px;border-radius:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
