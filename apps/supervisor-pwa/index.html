<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F4D2B" />
<title>Tea Farm Ledger — Supervisor</title>
<link rel="manifest" href="/manifest.webmanifest" />
<style>
  :root { --green:#1F4D2B; --green2:#2D6A3E; --bg:#FAF6EA; --card:#FFFDF6; --text:#23231F; --accent:#E3A72F; --line:#D9D2BC; --mute:#4A4A42; --gold:#E3A72F; }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
  header{background:var(--green);color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:20px;font-family:Georgia,"Times New Roman",serif}
  h2,h3{font-family:Georgia,"Times New Roman",serif}
  .banner{background:#FFF9C4;border:1px solid #FBC02D;padding:8px 12px;margin:12px;border-radius:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px}
  button{font-size:18px;padding:14px 18px;border-radius:12px;border:0;background:var(--green2);color:white;min-height:56px;min-width:120px}
  button.secondary{background:white;color:var(--green2);border:2px solid var(--green2)}
  input,select{font-size:18px;padding:12px;border:2px solid #9E9E9E;border-radius:10px;width:100%}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .pending{font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
